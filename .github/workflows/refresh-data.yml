name: Refresh market data

# Pulls real daily bars (Tiingo, falling back to Stooq then Yahoo), re-curates
# the drill windows against them, validates the result and commits to main. The
# Pages workflow triggers on that push, so a successful run ends with the data
# live.
#
# Why this lives in Actions rather than in the repo owner's terminal: the
# sandbox this project was built in cannot reach any provider, and a monthly
# manual chore is a chore nobody does. A GitHub-hosted runner has plain outbound
# internet, so the fetch that has never run locally runs here.
#
# ⚠ TWO LIVE RUNS FAILED BEFORE THIS NEEDED AN API KEY.
#   Run 1: Stooq answered all 27 symbols with a JavaScript anti-bot page, which
#   it serves to GitHub's datacenter IP ranges. Run 2, with a Yahoo fallback
#   added: Yahoo answered HTTP 429 for all 27, same underlying reason. Nothing
#   bad shipped either time — the failure budget and carry-forward held — but a
#   keyless provider cannot be relied on from a datacenter.
#
#   So the fetch now prefers **Tiingo**, which is keyed and therefore does not
#   care where the request comes from. The key lives in the repository secret
#   TIINGO_API_KEY (Settings → Secrets and variables → Actions) and is passed
#   to the step as an env var — never committed, never printed, and absent from
#   the request URL. Without it the run falls back to the two keyless providers
#   and will almost certainly fail; the step below warns about exactly that.
#   Which provider actually answered per symbol is recorded in
#   `public/data/manifest.json`.

on:
  workflow_dispatch:
  # 06:00 UTC on the 1st of each month — after the previous month has closed.
  schedule:
    - cron: '0 6 1 * *'

# One refresh at a time. A queued manual run waits for the cron run rather than
# racing it to a push; never cancel in flight, because a half-finished fetch
# would leave the working tree inconsistent.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A missing key is not fatal — the keyless providers still work from a
      # laptop, and a run is allowed to try — but it is the single most likely
      # reason for a CI failure here, so say so up front rather than leaving it
      # to be inferred from 27 identical HTTP 429s.
      #
      # The test is on an env var rather than `if: secrets.… == ''` because the
      # `secrets` context is not available in a step-level `if`; mapping it into
      # `env` first is the supported way to branch on "is this secret set".
      - name: Check for the Tiingo key
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          if [ -z "$TIINGO_API_KEY" ]; then
            echo "::warning::TIINGO_API_KEY secret not set — falling back to keyless providers, which block CI IPs"
          else
            echo "TIINGO_API_KEY is set."
          fi

      # ~27 symbols with a polite delay between them: two or three minutes of
      # wall clock, or a little more when a provider has to be given up on and
      # every symbol goes the long way round.
      #
      # --max-failures=3 tolerates a few flaky tickers (the previously committed
      # bars are kept for those, so the universe never shrinks); --min-bars=2000
      # rejects a truncated history rather than letting it invalidate every
      # drill window curated against it.
      - name: Fetch real bars (Tiingo, falling back to Stooq then Yahoo)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: node scripts/fetch-data.mjs --max-failures=3 --min-bars=2000

      # Gate the dataset before anything is derived from it. Also prints which
      # provider answered for how many symbols, so a run that quietly went
      # entirely to the fallback is visible in the job log.
      - name: Validate the dataset
        run: node scripts/validate-data.mjs --min-bars=2000 --expect-symbols=27

      # Re-derive every drill window from the new bars. The old indices point at
      # different days now, so this is not optional.
      - name: Re-curate drill windows
        run: node scripts/curate-windows.mjs --report

      # Targeted and fast: the suites that actually read public/data. The full
      # suite runs on the Pages deploy that this push triggers.
      - name: Test the refreshed content
        run: npx vitest run tests/windows.test.ts tests/bundled.test.ts tests/drills.test.ts tests/finDrills.test.ts

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          # A month with no new bars (or an identical re-curation) must produce
          # no commit at all — an empty commit every month would republish the
          # site and reshuffle nothing.
          if git diff --cached --quiet; then
            echo 'No data changes — nothing to commit.'
            exit 0
          fi
          git commit -m 'Refresh market data from Stooq and re-curate drill windows'
          git push origin HEAD:main
